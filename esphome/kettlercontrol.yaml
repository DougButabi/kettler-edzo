substitutions:
  pulses_per_rev: "1"       # impulzus / pedálfordulat (kalibrálás folyamatban)
  meters_per_rev: "2.639"

esphome:
  name: kettlercontrol
  friendly_name: KettlerControl
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Ezen keresztül kapja az app az élő adatokat (SSE: http://kettlercontrol.local/events)
web_server:
  port: 80
  version: 3

sensor:
  - platform: pulse_meter
    id: kettler_rpm
    name: "Fordulatszám"
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
    internal_filter: 40ms
    timeout: 4s
    unit_of_measurement: "1/perc"
    accuracy_decimals: 0
    icon: mdi:speedometer
    filters:
      - lambda: return x / ${pulses_per_rev};
    total:
      id: kettler_tav
      name: "Táv"
      unit_of_measurement: "km"
      accuracy_decimals: 2
      icon: mdi:map-marker-distance
      filters:
        - lambda: return x / ${pulses_per_rev} * ${meters_per_rev} / 1000.0;

  - platform: template
    name: "Sebesség"
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    icon: mdi:run-fast
    update_interval: 1s
    lambda: |-
      float rpm = id(kettler_rpm).state;
      if (isnan(rpm)) return 0.0f;
      return rpm * ${meters_per_rev} * 60.0f / 1000.0f;

button:
  - platform: template
    name: "Új edzés"
    icon: mdi:restart
    on_press:
      - pulse_meter.set_total_pulses:
          id: kettler_rpm
          value: 0
